[package]
name = "eldoria-observer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace]

[dependencies]
eldoria-settlement = { path = "../settlement" }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
