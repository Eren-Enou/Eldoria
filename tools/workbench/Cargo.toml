[package]
name = "woi-workbench"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
default-run = "woi-workbench"

[workspace]

[features]
default = []
desktop = ["dep:eframe", "dep:chrono", "world-sessions"]
world-sessions = ["dep:persistent_world"]
portable = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
persistent_world = { package = "woi-persistent-world", path = "../../prototypes/persistent-world", optional = true, features = ["workbench-host"] }
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }

[build-dependencies]
sha2 = "0.10"
serde_json = "1"

[[bin]]
name = "woi-workbench"
path = "src/main.rs"
