[package]
name = "woi-persistent-world"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace]

[features]
workbench-host = []
failure-probes = []

[dependencies]
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
ciborium = "0.2.2"
sha2 = "0.10"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[lib]
path = "src/lib.rs"
