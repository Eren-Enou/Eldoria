[package]
name = "world-of-individuals"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "continuous-world"
path = "src/main.rs"
